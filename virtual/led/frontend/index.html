<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual LED Indicator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #led-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #0a0a15 100%);
      border: 3px solid #2a2a40;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 2px 4px rgba(255, 255, 255, 0.05);
      min-width: 300px;
    }
    #led {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      position: relative;
      border: 2px solid #1a1a2a;
    }
    #led::before {
      content: '';
      position: absolute;
      top: 15%;
      left: 20%;
      width: 35%;
      height: 30%;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      filter: blur(8px);
    }
    #led.on {
      box-shadow: 0 0 20px currentColor,
                  0 0 40px currentColor,
                  0 0 60px currentColor,
                  inset 0 0 20px rgba(255, 255, 255, 0.2);
    }
    #led.off {
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.6),
                  inset 0 -2px 4px rgba(255, 255, 255, 0.05);
    }
    #led-label {
      font-size: 20px;
      font-weight: bold;
      color: #aaaacc;
      text-align: center;
      letter-spacing: 3px;
      margin-top: 20px;
      min-height: 24px;
    }
    .info {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6c9bd1;
    }
    .status.connected { color: #4c9b4c; }
    .status.disconnected { color: #9b4c4c; }
  </style>
</head>
<body>
  <h1>Virtual LED Indicator</h1>
  <div id="led-container">
    <div id="led" class="off"></div>
    <div id="led-label"></div>
  </div>
  <div class="info">
    SCPI: tcp://localhost:5025<br>
    Commands: STAT:VAL &lt;0|1&gt;, CONF:ONCOL, CONF:OFFCOL, CONF:BLINK, CONF:LABEL
  </div>
  <div class="status" id="status">Connecting to WebSocket...</div>

  <script>
    'use strict';

    // ===========================================================================
    // Configuration
    // ===========================================================================
    const WS_URL = `ws://${window.location.hostname}:8000/ws`;

    // ===========================================================================
    // State
    // ===========================================================================
    let ledState = {
      state: false,
      onColor: '#00ff00',
      offColor: '#333333',
      blinkMs: 0,
      size: 80,
      label: ''
    };

    let wsConnected = false;
    let blinkIntervalId = null;
    let blinkVisible = true;

    // ===========================================================================
    // WebSocket
    // ===========================================================================
    function connectWebSocket() {
      const ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('WebSocket connected');
        wsConnected = true;
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          ledState.state = data.state;
          ledState.onColor = data.onColor || '#00ff00';
          ledState.offColor = data.offColor || '#333333';
          ledState.blinkMs = data.blinkMs || 0;
          ledState.size = data.size || 80;
          ledState.label = data.label || '';
          updateLED();
        } catch (e) {
          console.error('WebSocket parse error:', e);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        wsConnected = false;
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        // Attempt reconnect after 2 seconds
        setTimeout(connectWebSocket, 2000);
      };
    }

    // ===========================================================================
    // LED Update
    // ===========================================================================
    function updateLED() {
      const ledElement = document.getElementById('led');
      const labelElement = document.getElementById('led-label');

      // Stop any existing blink interval
      if (blinkIntervalId !== null) {
        clearInterval(blinkIntervalId);
        blinkIntervalId = null;
      }
      blinkVisible = true;

      // Update size
      ledElement.style.width = `${ledState.size}px`;
      ledElement.style.height = `${ledState.size}px`;

      // Update label
      labelElement.textContent = ledState.label;

      // Setup blink if configured
      if (ledState.blinkMs > 0 && ledState.state) {
        blinkIntervalId = setInterval(() => {
          blinkVisible = !blinkVisible;
          setLEDAppearance(ledElement, blinkVisible);
        }, ledState.blinkMs);
      }

      // Set initial appearance
      setLEDAppearance(ledElement, ledState.state);
    }

    function setLEDAppearance(element, isOn) {
      if (isOn) {
        element.className = 'on';
        element.style.backgroundColor = ledState.onColor;
        element.style.color = ledState.onColor;
      } else {
        element.className = 'off';
        element.style.backgroundColor = ledState.offColor;
        element.style.color = ledState.offColor;
      }
    }

    // ===========================================================================
    // Init
    // ===========================================================================
    connectWebSocket();
    updateLED();
  </script>
</body>
</html>
