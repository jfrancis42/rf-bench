<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Text LCD</title>
  <style>
    @font-face {
      font-family: 'Dot Matrix';
      src: url('/static/DotMatrix.TTF') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #0a0a15 100%);
      border: 3px solid #2a2a40;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 2px 4px rgba(255, 255, 255, 0.05);
    }
    #terminal-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #terminal {
      width: 700px;
      height: 400px;
      background: #a8a850;
      border: 2px solid #2a2a40;
      border-radius: 8px;
      padding: 15px;
      overflow-y: auto;
      font-family: 'Dot Matrix', 'Courier New', monospace;
      line-height: 1.4;
      scroll-behavior: smooth;
      color: #000000;
    }
    #terminal::-webkit-scrollbar {
      width: 10px;
    }
    #terminal::-webkit-scrollbar-track {
      background: #0a0a0f;
    }
    #terminal::-webkit-scrollbar-thumb {
      background: #2a2a40;
      border-radius: 5px;
    }
    #terminal::-webkit-scrollbar-thumb:hover {
      background: #3a3a50;
    }
    .terminal-line {
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 2px;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 14px;
      background-color: currentColor;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6c9bd1;
    }
    .status.connected { color: #4c9b4c; }
    .status.disconnected { color: #9b4c4c; }
  </style>
</head>
<body>
  <h1>Virtual Text LCD</h1>
  <div id="container">
    <div id="terminal-title">Terminal</div>
    <div id="terminal">
      <div class="terminal-line">Ready.<span class="cursor"></span></div>
    </div>
  </div>
  <div class="info">
    SCPI: tcp://localhost:5031<br>
    Commands: DISP:TEXT, DISP:CLEAR, CONF:LINES, CONF:SIZE, CONF:COL
  </div>
  <div class="status" id="status">Connecting...</div>

  <script>
    'use strict';
    const WS_URL = `ws://${window.location.hostname}:9000/ws`;
    const terminal = document.getElementById('terminal');

    let terminalState = {
      lines: [],
      maxLines: 50,
      fontSize: 14,
      color: '#000000',
      title: 'Terminal'
    };

    function connectWebSocket() {
      const ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('WebSocket connected');
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          terminalState.lines = data.lines || [];
          terminalState.maxLines = data.maxLines || 50;
          terminalState.fontSize = data.fontSize || 14;
          terminalState.color = data.color || '#00ff00';
          terminalState.title = data.title || 'Terminal';
          updateDisplay();
        } catch (e) {
          console.error('WebSocket parse error:', e);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        setTimeout(connectWebSocket, 2000);
      };
    }

    function updateDisplay() {
      // Update title
      document.getElementById('terminal-title').textContent = terminalState.title;

      // Update terminal style
      terminal.style.fontSize = terminalState.fontSize + 'px';
      terminal.style.color = terminalState.color;

      // Update terminal content
      terminal.innerHTML = '';

      if (terminalState.lines.length === 0) {
        const line = document.createElement('div');
        line.className = 'terminal-line';
        line.textContent = 'Ready.';

        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        line.appendChild(cursor);

        terminal.appendChild(line);
      } else {
        terminalState.lines.forEach((lineText, index) => {
          const line = document.createElement('div');
          line.className = 'terminal-line';
          line.textContent = lineText;

          // Add cursor to last line
          if (index === terminalState.lines.length - 1) {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            line.appendChild(cursor);
          }

          terminal.appendChild(line);
        });

        // Auto-scroll to bottom
        terminal.scrollTop = terminal.scrollHeight;
      }
    }

    connectWebSocket();
    updateDisplay();
  </script>
</body>
</html>
