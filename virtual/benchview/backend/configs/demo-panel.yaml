panel:
  name: "RF Bench Demo Panel"
  description: "Live demonstration of multi-instance virtual instruments"
  grid:
    columns: 3
    rows: 3
    gap: 10px

  instruments:
    # Top row: Power monitoring
    - name: "power-meter"
      type: "analog-meter"
      count: 2
      layout: "ROW"
      position: {col: 0, row: 0}
      span: {cols: 2, rows: 1}

    - name: "ptt-led"
      type: "led"
      count: 4
      layout: "2X2"
      position: {col: 2, row: 0}
      span: {cols: 1, rows: 1}

    # Middle row: Signal levels
    - name: "signal-bars"
      type: "bar-graph"
      count: 3
      layout: "ROW"
      position: {col: 0, row: 1}
      span: {cols: 3, rows: 1}

    # Bottom row: Controls and displays
    - name: "freq-display"
      type: "numeric-display"
      count: 2
      layout: "ROW"
      position: {col: 0, row: 2}
      span: {cols: 2, rows: 1}

    - name: "volume-knob"
      type: "knob"
      count: 1
      layout: "ROW"
      position: {col: 2, row: 2}
      span: {cols: 1, rows: 1}
