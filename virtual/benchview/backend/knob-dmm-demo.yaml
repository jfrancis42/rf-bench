# BenchView Knob-DMM Feedback Demo
# Knob controls SPD3303X CH1 voltage, Numeric display shows SDM3045X reading

panel:
  name: "Knob-DMM Demo"
  grid:
    columns: 2
    rows: 1

  instruments:
    - name: voltage-knob
      type: knob
      count: 1
      position: {col: 0, row: 0}
      span: {cols: 1, rows: 1}
      config:
        label: "PSU CH1 Voltage"
        min: 0.0
        max: 30.0
        units: "V"

    - name: voltage-display
      type: numeric-display
      count: 1
      position: {col: 1, row: 0}
      span: {cols: 1, rows: 1}
      config:
        style: "NIXIE"
        color: "#ff6600"
        precision: 3
        units: "V"
        size: 90
