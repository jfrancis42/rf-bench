<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bar Graph</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      background: #0a0a0f;
      position: relative;
    }

    

    #grid {
      width: 100%;
      height: 100%;
      display: grid;
      gap: 10px;
      padding: 20px;
    }
    #grid.layout-row { grid-template-columns: repeat(var(--count), 1fr); grid-template-rows: 1fr; }
    #grid.layout-col { grid-template-columns: 1fr; grid-template-rows: repeat(var(--count), 1fr); }
    #grid.layout-2x2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

    .bar-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #0a0a15 100%);
      border: 2px solid #2a2a40;
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.05);
      gap: 10px;
    }

    .bar-label {
      font-size: clamp(10px, 2vw, 14px);
      color: #888;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      min-height: 1em;
    }

    .bar-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .bar-track {
      width: 80%;
      height: 30px;
      background: #1a1a2a;
      border: 2px solid #2a2a40;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #00ff88 0%, #00aa55 100%);
      transition: width 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
    }

    .bar-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 4px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    'use strict';

    const params = new URLSearchParams(window.location.search);
    const count = parseInt(params.get('count') || '1');
    const layout = params.get('layout') || 'row';
    const wsPort = params.get('ws_port') || '8004';

    let ws = null;
    let bars = [];

    function initBars() {
      const grid = document.getElementById('grid');
      grid.className = `layout-${layout}`;
      grid.style.setProperty('--count', count);

      for (let i = 1; i <= count; i++) {
        const panel = document.createElement('div');
        panel.className = 'bar-panel';
        panel.id = `bar-panel-${i}`;
        panel.innerHTML = `
          <div class="bar-label"></div>
          <div class="bar-container">
            <div class="bar-track">
              <div class="bar-fill" id="bar-fill-${i}"></div>
              <div class="bar-value" id="bar-value-${i}">0</div>
            </div>
          </div>
        `;
        grid.appendChild(panel);

        bars[i] = {
          value: 0.0,
          min: 0.0,
          max: 100.0,
          label: '',
          units: '',
          color: '#00ff88'
        };
      }
    }

    function updateBar(index, state) {
      const panel = document.getElementById(`bar-panel-${index}`);
      if (!panel) return;

      const labelEl = panel.querySelector('.bar-label');
      const fillEl = document.getElementById(`bar-fill-${index}`);
      const valueEl = document.getElementById(`bar-value-${index}`);

      bars[index] = { ...bars[index], ...state };
      const bar = bars[index];

      if (state.label !== undefined) {
        labelEl.textContent = state.label;
      }

      const range = bar.max - bar.min;
      const percent = ((bar.value - bar.min) / range) * 100;
      fillEl.style.width = `${Math.max(0, Math.min(100, percent))}%`;

      if (state.color) {
        fillEl.style.background = `linear-gradient(90deg, ${state.color} 0%, ${state.color}88 100%)`;
        fillEl.style.boxShadow = `0 0 10px ${state.color}88`;
      }

      const displayValue = bar.units ? `${bar.value.toFixed(1)} ${bar.units}` : bar.value.toFixed(1);
      valueEl.textContent = displayValue;
    }

    function connect() {
      ws = new WebSocket(`ws://${window.location.hostname}:${wsPort}/ws`);

      ws.onopen = () => {
        console.log('WebSocket connected');
        };

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.index && msg.index >= 1 && msg.index <= count) {
            updateBar(msg.index, msg);
          }
        } catch (e) {
          console.error('Parse error:', e);
        }
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        setTimeout(connect, 2000);
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };
    }

    initBars();
    connect();

    for (let i = 1; i <= count; i++) {
      updateBar(i, bars[i]);
    }
  </script>
</body>
</html>
