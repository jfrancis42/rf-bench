<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Analog Meter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #canvas {
      display: block;
      border: 2px solid #1a2040;
      background: #06080f;
    }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6c9bd1;
    }
    .status.connected { color: #4c9b4c; }
    .status.disconnected { color: #9b4c4c; }
  </style>
</head>
<body>
  <h1>Virtual Analog Meter</h1>
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="info">
    SCPI: tcp://localhost:5025<br>
    Commands: MEAS:VAL &lt;value&gt;, CONF:MIN/MAX, CONF:UNIT
  </div>
  <div class="status" id="status">Connecting to WebSocket...</div>

  <script>
    'use strict';

    // ===========================================================================
    // Configuration
    // ===========================================================================
    const WS_URL = `ws://${window.location.hostname}:${window.location.port}/ws`;
    const CANVAS_SIZE = 400;
    const GAUGE_RADIUS = 140;
    const GAUGE_START = (3 * Math.PI) / 4;   // 135° from east (SW)
    const GAUGE_SWEEP = (3 * Math.PI) / 2;   // 270° clockwise

    // Spring-damper physics constants (from starship-lander/instruments.js)
    // Underdamped second-order system: ζ ≈ 0.65, ω₀ ≈ 2π × 3 Hz
    const SPRING = 355;
    const DAMPING = 23;

    // ===========================================================================
    // State
    // ===========================================================================
    let meterState = {
      targetValue: 0,      // Target value from SCPI/WebSocket
      displayValue: 0,     // Current needle position (animated)
      velocity: 0,         // Needle velocity (for spring-damper)
      min: 0,
      max: 100,
      units: '',
      zones: [
        { id: 1, v0: 0, v1: 33, color: '#226644' },
        { id: 2, v0: 33, v1: 66, color: '#886600' },
        { id: 3, v0: 66, v1: 100, color: '#882222' }
      ]
    };

    let lastFrameTime = performance.now();
    let wsConnected = false;

    // ===========================================================================
    // WebSocket
    // ===========================================================================
    function connectWebSocket() {
      const ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('WebSocket connected');
        wsConnected = true;
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          meterState.targetValue = data.value;
          meterState.min = data.min;
          meterState.max = data.max;
          meterState.units = data.units || '';
          meterState.zones = data.zones || meterState.zones;
        } catch (e) {
          console.error('WebSocket parse error:', e);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        wsConnected = false;
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        // Attempt reconnect after 2 seconds
        setTimeout(connectWebSocket, 2000);
      };
    }

    // ===========================================================================
    // Rendering
    // ===========================================================================
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const centerX = CANVAS_SIZE / 2;
    const centerY = CANVAS_SIZE / 2;

    function drawGauge() {
      const now = performance.now();
      const dt = Math.min((now - lastFrameTime) / 1000, 0.1); // Cap dt to avoid large jumps
      lastFrameTime = now;

      // Clear canvas
      ctx.fillStyle = '#06080f';
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

      // Update needle physics (spring-damper)
      if (dt > 0) {
        const error = meterState.targetValue - meterState.displayValue;
        const accel = error * SPRING - meterState.velocity * DAMPING;
        meterState.velocity += accel * dt;
        meterState.displayValue += meterState.velocity * dt;
      } else {
        // First frame: snap to target
        meterState.displayValue = meterState.targetValue;
        meterState.velocity = 0;
      }

      // Draw bezel (outer ring)
      const gradient = ctx.createRadialGradient(
        centerX - GAUGE_RADIUS * 0.15, centerY - GAUGE_RADIUS * 0.25, GAUGE_RADIUS * 0.4,
        centerX, centerY, GAUGE_RADIUS + 8
      );
      gradient.addColorStop(0, '#2c2c44');
      gradient.addColorStop(1, '#0c0c1a');

      ctx.beginPath();
      ctx.arc(centerX, centerY, GAUGE_RADIUS + 8, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
      ctx.strokeStyle = '#28283e';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw face (inner background)
      const faceGrad = ctx.createRadialGradient(
        centerX, centerY, 0,
        centerX, centerY, GAUGE_RADIUS
      );
      faceGrad.addColorStop(0, '#0f0f1a');
      faceGrad.addColorStop(1, '#05050c');

      ctx.beginPath();
      ctx.arc(centerX, centerY, GAUGE_RADIUS, 0, Math.PI * 2);
      ctx.fillStyle = faceGrad;
      ctx.fill();

      // Draw colored zones
      for (const zone of meterState.zones) {
        const frac0 = (zone.v0 - meterState.min) / (meterState.max - meterState.min);
        const frac1 = (zone.v1 - meterState.min) / (meterState.max - meterState.min);
        const angle0 = GAUGE_START + frac0 * GAUGE_SWEEP;
        const angle1 = GAUGE_START + frac1 * GAUGE_SWEEP;

        ctx.beginPath();
        ctx.arc(centerX, centerY, GAUGE_RADIUS - 8, angle0, angle1);
        ctx.strokeStyle = zone.color;
        ctx.lineWidth = 12;
        ctx.stroke();
      }

      // Draw tick marks
      ctx.strokeStyle = '#555570';
      ctx.lineWidth = 1.5;
      const numTicks = 10;
      for (let i = 0; i <= numTicks; i++) {
        const frac = i / numTicks;
        const angle = GAUGE_START + frac * GAUGE_SWEEP;
        const isMajor = (i % 5 === 0);
        const r1 = GAUGE_RADIUS - 18;
        const r2 = GAUGE_RADIUS - (isMajor ? 32 : 26);

        ctx.beginPath();
        ctx.moveTo(
          centerX + Math.cos(angle) * r1,
          centerY + Math.sin(angle) * r1
        );
        ctx.lineTo(
          centerX + Math.cos(angle) * r2,
          centerY + Math.sin(angle) * r2
        );
        ctx.stroke();

        // Draw tick labels on major ticks
        if (isMajor) {
          const val = meterState.min + frac * (meterState.max - meterState.min);
          const labelR = GAUGE_RADIUS - 45;
          const labelX = centerX + Math.cos(angle) * labelR;
          const labelY = centerY + Math.sin(angle) * labelR;

          ctx.fillStyle = '#aaaacc';
          ctx.font = '12px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(Math.round(val).toString(), labelX, labelY);
        }
      }

      // Draw center label (units)
      ctx.fillStyle = '#aaaacc';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(meterState.units || 'UNITS', centerX, centerY + 40);

      // Draw current value readout
      const valueStr = meterState.targetValue.toFixed(1);
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillStyle = '#e0e0e0';
      ctx.fillText(valueStr, centerX, centerY + 65);

      // Draw needle
      const needleFrac = (meterState.displayValue - meterState.min) / (meterState.max - meterState.min);
      const needleAngle = GAUGE_START + needleFrac * GAUGE_SWEEP;
      const needleLength = GAUGE_RADIUS - 25;

      // Needle shadow
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(centerX + 2, centerY + 2);
      ctx.lineTo(
        centerX + 2 + Math.cos(needleAngle) * needleLength,
        centerY + 2 + Math.sin(needleAngle) * needleLength
      );
      ctx.stroke();

      // Needle main
      ctx.strokeStyle = '#ff6644';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(
        centerX + Math.cos(needleAngle) * needleLength,
        centerY + Math.sin(needleAngle) * needleLength
      );
      ctx.stroke();

      // Needle tip (arrowhead)
      ctx.fillStyle = '#ff6644';
      ctx.beginPath();
      ctx.arc(
        centerX + Math.cos(needleAngle) * needleLength,
        centerY + Math.sin(needleAngle) * needleLength,
        4, 0, Math.PI * 2
      );
      ctx.fill();

      // Center hub
      const hubGrad = ctx.createRadialGradient(
        centerX - 2, centerY - 2, 0,
        centerX, centerY, 10
      );
      hubGrad.addColorStop(0, '#444466');
      hubGrad.addColorStop(1, '#1a1a2a');

      ctx.beginPath();
      ctx.arc(centerX, centerY, 10, 0, Math.PI * 2);
      ctx.fillStyle = hubGrad;
      ctx.fill();
      ctx.strokeStyle = '#222233';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Request next frame
      requestAnimationFrame(drawGauge);
    }

    // ===========================================================================
    // Init
    // ===========================================================================
    connectWebSocket();
    requestAnimationFrame(drawGauge);
  </script>
</body>
</html>
