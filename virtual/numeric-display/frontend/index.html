<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Numeric Display</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #0a0a15 100%);
      border: 3px solid #2a2a40;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 2px 4px rgba(255, 255, 255, 0.05);
      min-width: 400px;
    }
    #display-value {
      font-size: 80px;
      font-weight: bold;
      color: #00ff00;
      text-align: center;
      text-shadow: 0 0 20px currentColor,
                   0 0 40px currentColor,
                   0 0 60px rgba(0, 255, 0, 0.3);
      letter-spacing: 8px;
      margin-bottom: 10px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #display-value.seven-segment {
      font-family: 'Courier New', 'Lucida Console', monospace;
      font-weight: bold;
    }
    #display-value.plain {
      font-family: 'Arial', 'Helvetica', sans-serif;
    }
    #display-units {
      font-size: 24px;
      color: #888;
      text-align: center;
      letter-spacing: 4px;
      margin-top: 10px;
      min-height: 30px;
    }
    .info {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6c9bd1;
    }
    .status.connected { color: #4c9b4c; }
    .status.disconnected { color: #9b4c4c; }
  </style>
</head>
<body>
  <h1>Virtual Numeric Display</h1>
  <div id="display-container">
    <div id="display-value" class="seven-segment">0.00</div>
    <div id="display-units"></div>
  </div>
  <div class="info">
    SCPI: tcp://localhost:5025<br>
    Commands: MEAS:VAL &lt;value&gt;, CONF:PREC, CONF:UNIT, CONF:SIZE, CONF:COL, CONF:STYLE
  </div>
  <div class="status" id="status">Connecting to WebSocket...</div>

  <script>
    'use strict';

    // ===========================================================================
    // Configuration
    // ===========================================================================
    const WS_URL = `ws://${window.location.hostname}:8000/ws`;

    // ===========================================================================
    // State
    // ===========================================================================
    let displayState = {
      value: 0.0,
      precision: 2,
      units: '',
      fontSize: 80,
      color: '#00ff00',
      style: '7SEG'
    };

    let wsConnected = false;

    // ===========================================================================
    // WebSocket
    // ===========================================================================
    function connectWebSocket() {
      const ws = new WebSocket(WS_URL);

      ws.onopen = () => {
        console.log('WebSocket connected');
        wsConnected = true;
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };

      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          displayState.value = data.value;
          displayState.precision = data.precision;
          displayState.units = data.units || '';
          displayState.fontSize = data.fontSize || 80;
          displayState.color = data.color || '#00ff00';
          displayState.style = data.style || '7SEG';
          updateDisplay();
        } catch (e) {
          console.error('WebSocket parse error:', e);
        }
      };

      ws.onerror = (error) => {
        console.error('WebSocket error:', error);
      };

      ws.onclose = () => {
        console.log('WebSocket disconnected');
        wsConnected = false;
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        // Attempt reconnect after 2 seconds
        setTimeout(connectWebSocket, 2000);
      };
    }

    // ===========================================================================
    // Display Update
    // ===========================================================================
    function updateDisplay() {
      const valueElement = document.getElementById('display-value');
      const unitsElement = document.getElementById('display-units');

      // Format value with configured precision
      const formattedValue = displayState.value.toFixed(displayState.precision);

      // Update value text
      valueElement.textContent = formattedValue;

      // Update units
      unitsElement.textContent = displayState.units;

      // Update font size
      valueElement.style.fontSize = `${displayState.fontSize}px`;

      // Update color (and text-shadow glow to match)
      valueElement.style.color = displayState.color;
      valueElement.style.textShadow = `
        0 0 20px ${displayState.color},
        0 0 40px ${displayState.color},
        0 0 60px ${hexToRgba(displayState.color, 0.3)}
      `;

      // Update style (font family)
      if (displayState.style === '7SEG') {
        valueElement.className = 'seven-segment';
      } else {
        valueElement.className = 'plain';
      }
    }

    // ===========================================================================
    // Utility Functions
    // ===========================================================================
    function hexToRgba(hex, alpha) {
      // Convert hex color to rgba with specified alpha
      let r = 0, g = 0, b = 0;

      // Handle #RGB and #RRGGBB formats
      if (hex.length === 4) {
        r = parseInt(hex[1] + hex[1], 16);
        g = parseInt(hex[2] + hex[2], 16);
        b = parseInt(hex[3] + hex[3], 16);
      } else if (hex.length === 7) {
        r = parseInt(hex[1] + hex[2], 16);
        g = parseInt(hex[3] + hex[4], 16);
        b = parseInt(hex[5] + hex[6], 16);
      }

      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ===========================================================================
    // Init
    // ===========================================================================
    connectWebSocket();
    updateDisplay();
  </script>
</body>
</html>
