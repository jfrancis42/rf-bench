<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Numeric Display</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nixie+One&family=Orbitron:wght@900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'DSEG7';
      src: url('fonts-DSEG_v046/DSEG7-Classic/DSEG7Classic-Regular.woff2') format('woff2'),
           url('fonts-DSEG_v046/DSEG7-Classic/DSEG7Classic-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'reNix';
      src: url('fonts/reNix-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'fluoWrite';
      src: url('fonts/fluoWrite-Regular.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #6c9bd1;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #display-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: linear-gradient(135deg, #1a1a2a 0%, #0a0a15 100%);
      border: 3px solid #2a2a40;
      border-radius: 12px;
      padding: 40px 60px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8),
                  inset 0 2px 4px rgba(255, 255, 255, 0.05);
      min-width: 600px;
    }
    #display-value {
      font-size: 80px;
      font-weight: 400;
      color: #00ff00;
      text-align: center;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-variant-numeric: tabular-nums;
      white-space: pre;
    }
    #display-background {
      position: absolute;
      text-shadow: none;
      z-index: 0;
      left: 0;
      right: 0;
    }
    #display-foreground {
      position: relative;
      z-index: 1;
    }
    #display-value.seven-segment,
    #display-value.led {
      font-family: 'DSEG7', 'Orbitron', 'Arial Black', monospace;
      font-weight: 400;
      font-stretch: normal;
      letter-spacing: 0.05em;
    }
    #display-value.seven-segment #display-background {
      color: rgba(0, 255, 0, 0.15);
    }
    #display-value.seven-segment #display-foreground {
      text-shadow: 0 0 20px #00ff00,
                   0 0 40px #00ff00,
                   0 0 60px rgba(0, 255, 0, 0.3);
    }
    #display-value.plain {
      font-family: 'Orbitron', 'Arial', sans-serif;
      font-weight: 900;
      letter-spacing: 0.05em;
    }
    #display-value.plain #display-foreground {
      text-shadow: 0 0 20px currentColor,
                   0 0 40px currentColor,
                   0 0 60px rgba(0, 255, 0, 0.3);
    }
    #display-value.led {
      background: #1a0000;
      padding: 20px 140px;
      border-radius: 8px;
    }
    #display-value.led #display-foreground {
      color: #ff3333;
      text-shadow: 0 0 10px #ff0000,
                   0 0 20px #ff0000,
                   0 0 30px rgba(255, 0, 0, 0.5);
    }
    #display-value.led #display-background {
      color: rgba(255, 0, 0, 0.12);
    }
    #display-value.nixie {
      font-family: 'reNix', 'Nixie One', 'Times New Roman', serif;
      font-weight: 400;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
      background: radial-gradient(ellipse at center, rgba(40, 20, 10, 0.8) 0%, rgba(20, 10, 5, 0.9) 70%, rgba(0, 0, 0, 0.95) 100%);
      padding: 30px 120px;
      border-radius: 6px;
      border: 2px solid #332211;
      box-shadow: inset 0 0 40px rgba(255, 136, 51, 0.15),
                  0 0 20px rgba(255, 136, 51, 0.2);
    }
    #display-value.nixie #display-foreground {
      color: #ff8833;
      text-shadow: 0 0 15px #ff8833,
                   0 0 30px #ff6611,
                   0 0 45px rgba(255, 102, 17, 0.4);
    }
    #display-value.nixie #display-background {
      color: rgba(255, 136, 51, 0.08);
    }
    #display-value.vfd {
      font-family: 'fluoWrite', 'Courier New', monospace;
      font-weight: 400;
      letter-spacing: 0.08em;
      font-variant-numeric: tabular-nums;
      background: linear-gradient(135deg, #001a1a 0%, #002222 50%, #001a1a 100%);
      padding: 30px 120px;
      border-radius: 4px;
      border: 2px solid #003333;
      box-shadow: inset 0 0 30px rgba(0, 255, 255, 0.1),
                  0 0 15px rgba(0, 255, 255, 0.15);
    }
    #display-value.vfd #display-foreground {
      color: #00ffcc;
      text-shadow: 0 0 12px #00ffcc,
                   0 0 25px #00ddaa,
                   0 0 40px rgba(0, 255, 204, 0.3);
    }
    #display-value.vfd #display-background {
      color: rgba(0, 255, 204, 0.06);
    }
    #display-units {
      font-size: 24px;
      color: #888;
      text-align: center;
      letter-spacing: 4px;
      margin-top: 10px;
      min-height: 30px;
    }
    .info {
      margin-top: 30px;
      font-size: 12px;
      color: #888;
      text-align: center;
    }
    .status {
      margin-top: 10px;
      font-size: 11px;
      color: #6c9bd1;
    }
    .status.connected { color: #4c9b4c; }
    .status.disconnected { color: #9b4c4c; }
  </style>
</head>
<body>
  <h1>Virtual Numeric Display</h1>
  <div id="display-container">
    <div id="display-value" class="seven-segment">
      <span id="display-foreground">       0</span>
    </div>
    <div id="display-units"></div>
  </div>
  <div class="info">
    SCPI: tcp://localhost:5025<br>
    Styles: 7SEG (green LCD), PLAIN (text), LED (red 7-seg), NIXIE (orange tube)
  </div>
  <div class="status" id="status">Connecting...</div>

  <script>
    'use strict';
    const WS_URL = `ws://${window.location.hostname}:8000/ws`;
    
    let displayState = {
      value: 0.0,
      precision: 2,
      digits: 8,
      units: '',
      fontSize: 80,
      color: '#00ff00',
      style: '7SEG'
    };
    
    let wsConnected = false;
    
    function connectWebSocket() {
      const ws = new WebSocket(WS_URL);
      
      ws.onopen = () => {
        wsConnected = true;
        document.getElementById('status').textContent = 'Connected';
        document.getElementById('status').className = 'status connected';
      };
      
      ws.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          displayState.value = data.value;
          displayState.precision = data.precision;
          displayState.digits = data.digits || 8;
          displayState.units = data.units || '';
          displayState.fontSize = data.fontSize || 80;
          displayState.color = data.color || '#00ff00';
          displayState.style = data.style || '7SEG';
          updateDisplay();
        } catch (e) {
        }
      };
      
      ws.onerror = (error) => {
      };
      
      ws.onclose = () => {
        wsConnected = false;
        document.getElementById('status').textContent = 'Disconnected - Reconnecting...';
        document.getElementById('status').className = 'status disconnected';
        setTimeout(connectWebSocket, 2000);
      };
    }
    
    function updateDisplay() {
      const valueElement = document.getElementById('display-value');
      const foregroundElement = document.getElementById('display-foreground');
      const unitsElement = document.getElementById('display-units');

      let formattedValue = displayState.value.toFixed(displayState.precision);

      const totalDigits = displayState.digits;
      if (formattedValue.length < totalDigits) {
        formattedValue = ' '.repeat(totalDigits - formattedValue.length) + formattedValue;
      } else if (formattedValue.length > totalDigits) {
        formattedValue = '8'.repeat(totalDigits);
      }

      foregroundElement.textContent = formattedValue;
      unitsElement.textContent = displayState.units;
      valueElement.style.fontSize = `${displayState.fontSize}px`;
      
      const style = displayState.style.toUpperCase();
      if (style === '7SEG') {
        valueElement.className = 'seven-segment';
      } else if (style === 'PLAIN') {
        valueElement.className = 'plain';
      } else if (style === 'LED') {
        valueElement.className = 'led';
      } else if (style === 'NIXIE') {
        valueElement.className = 'nixie';
      } else if (style === 'VFD') {
        valueElement.className = 'vfd';
      } else {
        valueElement.className = 'seven-segment';
      }
    }
    
    connectWebSocket();
    updateDisplay();
  </script>
</body>
</html>
