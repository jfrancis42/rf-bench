[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-mightyohm"
version = "0.1.0"
description = "MightyOhm Geiger Counter driver for rf-bench"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Jeff Francis", email = "jeff@gritch.org"}
]
keywords = ["geiger", "radiation", "mightyohm", "rf-bench", "measurement"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Homepage = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_bench*"]
namespaces = true
