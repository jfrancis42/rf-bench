[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-gpib"
version = "0.1.0"
description = "GPIB bus transport for Python bench automation — KISS-488 Rev 2 Ethernet/USB adapter, shared-bus device handles, and a Spy-mode analyzer decoder"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["gpib", "ieee-488", "hpib", "kiss-488", "prologix", "bench-automation", "test-equipment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_bench.*"]
namespaces = true
