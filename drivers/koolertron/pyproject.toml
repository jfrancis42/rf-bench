[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-koolertron"
version = "0.2.0"
description = "Koolertron / MHinstek MHS-5200A series dual-channel DDS signal generator + frequency counter driver (covers KKmoon and other rebrands)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]
keywords = [
    "koolertron", "mhinstek", "mhs5200", "mhs-5200a", "kkmoon",
    "dds", "signal-generator", "function-generator", "arbitrary-waveform",
    "dual-channel", "frequency-counter", "sweep", "bench-automation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_bench.*"]
namespaces = true
