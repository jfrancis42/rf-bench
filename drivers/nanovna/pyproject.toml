[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-nanovna"
version = "0.1.0"
description = "NanoVNA / NanoVNA-H / NanoVNA-H4 driver for Python bench automation — ASCII shell over USB CDC"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "pyserial>=3.5",
]
keywords = [
    "nanovna", "vna", "vector-network-analyzer", "rf",
    "s-parameters", "antenna-analyzer", "bench-automation",
    "amateur-radio", "test-equipment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage   = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where      = ["."]
include    = ["rf_bench.*"]
namespaces = true
