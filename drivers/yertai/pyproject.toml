[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-yertai"
version = "0.1.0"
description = "Yertai ET5406A+ programmable DC load driver for bench automation — wrapper around upstream ET54 library"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
    "ET54==0.1",
    "pyvisa>=1.15.0",
    "pyvisa-py>=0.8.0",
]
keywords = ["yertai", "et5406a", "dc-load", "electronic-load", "scpi", "bench-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["rf_bench.*"]
namespaces = true
