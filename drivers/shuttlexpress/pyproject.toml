[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-shuttlexpress"
version = "0.1.0"
description = "Contour Design ShuttleXpress USB jog/shuttle controller driver"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "evdev>=1.6",
]
keywords = [
    "shuttlexpress", "shuttle", "jog", "contour-design",
    "hid", "usb", "evdev", "controller",
    "bench-automation", "amateur-radio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage   = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

[tool.setuptools.packages.find]
where      = ["."]
include    = ["rf_bench.*"]
namespaces = true
