[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-virtual"
version = "0.1.0"
description = "Python clients for the rf-bench virtual SCPI instruments — analog meter, LED, numeric display, bar graph, knob, slider, button, toggle, line chart, XY plot, waterfall, text LCD, text input, gauge cluster, compass, Smith chart"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = [
    "scpi", "virtual-instrument", "bench-automation", "test-equipment",
    "dashboard", "instrument-panel", "websocket", "canvas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"

# rf_bench is a PEP 420 namespace package — do NOT list "rf_bench" here and do
# NOT ship rf_bench/__init__.py, or this distribution will shadow every other
# rf_bench.* driver on the path.
[tool.setuptools.packages.find]
where = ["."]
include = ["rf_bench.*"]
namespaces = true
