[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-bench-drivers-solsdr"
version = "0.1.0"
description = "SunSDR2 PRO driver for bench automation via the solsdr appliance — ExpertSDR3-free RX + arbitrary-waveform TX IQ"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Jeff Francis", email = "gjfrancis@protonmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
]
keywords = [
    "solsdr", "sunsdr", "sunsdr2", "sdr", "hf", "vhf",
    "software-defined-radio", "iq", "tx-iq", "spectrum", "amateur-radio",
    "ham-radio", "bench-automation", "transceiver", "expertsdr-free",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

[project.urls]
Homepage   = "https://github.com/jfrancis42/rf-bench"
Repository = "https://github.com/jfrancis42/rf-bench"
"solsdr project" = "https://github.com/jfrancis42/solsdr"

[tool.setuptools.packages.find]
where      = ["."]
include    = ["rf_bench.*"]
namespaces = true
